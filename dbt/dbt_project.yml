name: 'nyc_business_analytics'
version: '1.0.0'
config-version: 2

profile: 'analytics_profile'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

quoting:
  database: true
  schema: true
  identifier: true

models:
  nyc_business_analytics:
    staging:
      +schema: staging
      +materialized: view
      +bind: false
    marts:
      +schema: marts
      +materialized: table
      +bind: false
